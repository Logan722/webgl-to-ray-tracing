
<html>

<!-- VERTEX SHADER SOURCE CODE: Written in GLSL -->
<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in vec4 aPosition;
uniform float uPntSize;

void main()
{
  gl_Position = aPosition;
  gl_PointSize = uPntSize;
}
</script>

<!-- FRAGMENT SHADER SOURCE CODE: Written in GLSL -->
<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;
uniform vec4 uColor;
out vec4  fColor;

void main()
{
    fColor = uColor;
}
</script>

<canvas id="gl-canvas" width="512" height="512"> </canvas>

<!-- Written in Javascript -->
<script>


// This compiles and links the shaders to create a GPU program object
// The GLSL code above is parsed and provided as the source code
function initShaders( gl, vertexShaderId, fragmentShaderId )
{
    var vertShdr;
    var fragShdr;

    var vertElem = document.getElementById( vertexShaderId );
    if ( !vertElem ) {
        alert( "Unable to load vertex shader " + vertexShaderId );
        return -1;
    }
    else {
        vertShdr = gl.createShader( gl.VERTEX_SHADER );
        gl.shaderSource( vertShdr, vertElem.textContent.replace(/^\s+|\s+$/g, '' ));
        gl.compileShader( vertShdr );
        if ( !gl.getShaderParameter(vertShdr, gl.COMPILE_STATUS) ) {
            var msg = "Vertex shader failed to compile.  The error log is:"
        	+ "<pre>" + gl.getShaderInfoLog( vertShdr ) + "</pre>";
            alert( msg );
            return -1;
        }
    }

    var fragElem = document.getElementById( fragmentShaderId );
    if ( !fragElem ) {
        alert( "Unable to load vertex shader " + fragmentShaderId );
        return -1;
    }
    else {
        fragShdr = gl.createShader( gl.FRAGMENT_SHADER );
        gl.shaderSource( fragShdr, fragElem.textContent.replace(/^\s+|\s+$/g, '' ) );
        gl.compileShader( fragShdr );
        if ( !gl.getShaderParameter(fragShdr, gl.COMPILE_STATUS) ) {
            var msg = "Fragment shader failed to compile.  The error log is:"
        	+ "<pre>" + gl.getShaderInfoLog( fragShdr ) + "</pre>";
            alert( msg );
            return -1;
        }
    }

    var program = gl.createProgram();
    gl.attachShader( program, vertShdr );
    gl.attachShader( program, fragShdr );
    gl.linkProgram( program );

    if ( !gl.getProgramParameter(program, gl.LINK_STATUS) ) {
        var msg = "Shader program failed to link.  The error log is:"
            + "<pre>" + gl.getProgramInfoLog( program ) + "</pre>";
        alert( msg );
        return -1;
    }

    return program;
}


// EXECUTION: Code executes starting here when we launch this file
window.onload = function init()
{
    canvas = document.getElementById( "gl-canvas" );

    //
    //   Grab the section of the screen for drawing.
    //   All graphic output is within the canvas
    //

    gl = canvas.getContext('webgl2');
    if (!gl) { alert( "WebGL 2.0 isn't available" ); }

    //
    //  Initialize our data for a Pizza Pie
    //


    ////////////////////////////////////////////////////////////////////////////////
    //  Load shaders and initialize attribute buffers
    //
    program = initShaders( gl, "vertex-shader", "fragment-shader" );
    gl.useProgram( program );


    ////////////////////////////////////////////////////////////////////////////////
    // Pizza Parameters
    // Use polar coordinates to place vertices along the circumference of a circle
    // centered at (0,0) in the XY-Plane.
    //

    var NUM_SLICES = 8;        // 8 slices of pizza
    var R_CHEESE   = 0.78;     // radius of the cheese/sauce area
    var R_CRUST    = 0.85;     // radius of the outer crust


    ////////////////////////////////////////////////////////////////////////////////
    // Define shapes using polar coordinates
    // Polar to Cartesian:  x = R * cos(angle),  y = R * sin(angle)
    // The GPU expects typed arrays and uses 4D points (x,y,z,w)
    //


    // --- Pizza cheese/sauce base: TRIANGLE_FAN ---
    // Center vertex + one vertex per slice boundary on the circumference
    var cheeseVerts = [];
    cheeseVerts.push( 0.0, 0.0 );   // center of the pizza
    for (var i = 0; i <= NUM_SLICES; i++)
    {
        var angle = (2.0 * Math.PI * i) / NUM_SLICES;
        //   X                              Y
        cheeseVerts.push( R_CHEESE * Math.cos(angle), R_CHEESE * Math.sin(angle) );
    }
    var cheesePoints = new Float32Array( cheeseVerts );


    // --- Crust ring: TRIANGLE_STRIP ---
    // Alternating inner edge and outer edge vertices around the circle
    var crustVerts = [];
    for (var i = 0; i <= NUM_SLICES; i++)
    {
        var angle = (2.0 * Math.PI * i) / NUM_SLICES;
        var cx = Math.cos(angle);
        var cy = Math.sin(angle);
        //   inner edge                     outer edge
        crustVerts.push( R_CHEESE * cx, R_CHEESE * cy );
        crustVerts.push( R_CRUST  * cx, R_CRUST  * cy );
    }
    var crustPoints = new Float32Array( crustVerts );


    // --- Slice divider lines: LINES ---
    // Each line goes from center (0,0) to the crust edge
    var lineVerts = [];
    for (var i = 0; i < NUM_SLICES; i++)
    {
        var angle = (2.0 * Math.PI * i) / NUM_SLICES;
        //   from center
        lineVerts.push( 0.0, 0.0 );
        //   to crust edge (polar -> cartesian)
        lineVerts.push( R_CRUST * Math.cos(angle), R_CRUST * Math.sin(angle) );
    }
    var linePoints = new Float32Array( lineVerts );


    // --- Pepperoni toppings: POINTS ---
    // One pepperoni per slice at radius 0.45, centered in each slice
    var pepVerts = [];
    for (var i = 0; i < NUM_SLICES; i++)
    {
        var midAngle = (2.0 * Math.PI * (i + 0.5)) / NUM_SLICES;
        var pr = 0.45;
        pepVerts.push( pr * Math.cos(midAngle), pr * Math.sin(midAngle) );
    }
    var pepPoints = new Float32Array( pepVerts );


    // --- Olive toppings: POINTS ---
    // One olive per slice at radius 0.22, slightly offset in each slice
    var oliveVerts = [];
    for (var i = 0; i < NUM_SLICES; i++)
    {
        var midAngle = (2.0 * Math.PI * (i + 0.3)) / NUM_SLICES;
        var or2 = 0.22;
        oliveVerts.push( or2 * Math.cos(midAngle), or2 * Math.sin(midAngle) );
    }
    var olivePoints = new Float32Array( oliveVerts );


    // --- Green pepper toppings: POINTS ---
    // A green pepper in every other slice at radius 0.62
    var gpVerts = [];
    for (var i = 0; i < NUM_SLICES; i += 2)
    {
        var midAngle = (2.0 * Math.PI * (i + 0.65)) / NUM_SLICES;
        var gr = 0.62;
        gpVerts.push( gr * Math.cos(midAngle), gr * Math.sin(midAngle) );
    }
    var gpPoints = new Float32Array( gpVerts );


    ////////////////////////////////////////////////////////////////////////////////
    // Get shader variable locations
    //

    // Associate out shader variables with our data buffer
    var aPosition = gl.getAttribLocation( program, "aPosition" );

    var uColor_location  = gl.getUniformLocation(program, "uColor");
    var uPntSize_Loc     = gl.getUniformLocation(program, "uPntSize");



    ////////////////////////////////////////////////////////////////////////////////
    // Configure WebGL settings and draw
    //
    // Configure area of canvas to map framebuffer
    gl.viewport( 0, 0, canvas.width, canvas.height ); //

    // Configure color to use to clear all pixels
    gl.clearColor( 0.82, 0.16, 0.16, 1.0 );    // Format: R, G, B, A  Normalized [0.0,1.0] (tablecloth red)

    // Clear all pixels in the framebuffer
    gl.clear( gl.COLOR_BUFFER_BIT );

    // Default point size
    gl.uniform1f(uPntSize_Loc, 1.0);


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 1:  Pizza cheese base  (TRIANGLE_FAN)
    // Color: warm yellow cheese
    //
    var cheeseBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, cheeseBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, cheesePoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.95, 0.82, 0.30, 1.0]);
    gl.drawArrays( gl.TRIANGLE_FAN, 0, cheesePoints.length / 2 );


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 2:  Crust ring  (TRIANGLE_STRIP)
    // Color: golden brown crust
    //
    var crustBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, crustBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, crustPoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.72, 0.50, 0.18, 1.0]);
    gl.drawArrays( gl.TRIANGLE_STRIP, 0, crustPoints.length / 2 );


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 3:  Slice divider lines  (LINES)
    // Color: darker brown cut lines
    //
    var lineBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, lineBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, linePoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.55, 0.35, 0.12, 1.0]);
    gl.drawArrays( gl.LINES, 0, linePoints.length / 2 );


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 4:  Pepperoni toppings  (POINTS)
    // Color: pepperoni red
    //
    var pepBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, pepBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, pepPoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.72, 0.11, 0.07, 1.0]);
    gl.uniform1f(uPntSize_Loc, 26.0);
    gl.drawArrays( gl.POINTS, 0, pepPoints.length / 2 );


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 5:  Olive toppings  (POINTS)
    // Color: dark olive / black
    //
    var oliveBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, oliveBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, olivePoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.15, 0.15, 0.08, 1.0]);
    gl.uniform1f(uPntSize_Loc, 16.0);
    gl.drawArrays( gl.POINTS, 0, olivePoints.length / 2 );


    ////////////////////////////////////////////////////////////////////////////////
    // DRAW CALL 6:  Green pepper toppings  (POINTS)
    // Color: green
    //
    var gpBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, gpBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, gpPoints, gl.STATIC_DRAW );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );

    gl.uniform4fv(uColor_location, [0.18, 0.60, 0.15, 1.0]);
    gl.uniform1f(uPntSize_Loc, 12.0);
    gl.drawArrays( gl.POINTS, 0, gpPoints.length / 2 );

};


</script>

</html>
