<html>

<!--
    CG_HW1_HomagetotheSquare
    Inspired by Josef Albers' "Homage to the Square" series (1950-1976)

    Implementation:
    - One vertex shader / one fragment shader pair
    - Uniform variables: uColor (vec4), uOffset (vec2), uScale (vec2)
    - Multiple calls to drawArrays (one per rectangle, drawn back-to-front)
    - 4 nested squares, horizontally centered, vertically shifted downward
-->

<!-- VERTEX SHADER SOURCE CODE: Written in GLSL -->
<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in vec4 aPosition;
uniform vec2 uOffset;
uniform vec2 uScale;

void main()
{
    // Transform the unit square by scale and offset uniforms
    gl_Position = vec4(aPosition.x * uScale.x + uOffset.x,
                       aPosition.y * uScale.y + uOffset.y,
                       0.0, 1.0);
}
</script>

<!-- FRAGMENT SHADER SOURCE CODE: Written in GLSL -->
<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;
uniform vec4 uColor;
out vec4 fColor;

void main()
{
    fColor = uColor;
}
</script>

<canvas id="gl-canvas" width="512" height="512"></canvas>

<!-- Written in Javascript -->
<script>

// This compiles and links the shaders to create a GPU program object
// The GLSL code above is parsed and provided as the source code
function initShaders( gl, vertexShaderId, fragmentShaderId )
{
    var vertShdr;
    var fragShdr;

    var vertElem = document.getElementById( vertexShaderId );
    if ( !vertElem ) {
        alert( "Unable to load vertex shader " + vertexShaderId );
        return -1;
    }
    else {
        vertShdr = gl.createShader( gl.VERTEX_SHADER );
        gl.shaderSource( vertShdr, vertElem.textContent.replace(/^\s+|\s+$/g, '' ));
        gl.compileShader( vertShdr );
        if ( !gl.getShaderParameter(vertShdr, gl.COMPILE_STATUS) ) {
            var msg = "Vertex shader failed to compile.  The error log is:"
        	+ "<pre>" + gl.getShaderInfoLog( vertShdr ) + "</pre>";
            alert( msg );
            return -1;
        }
    }

    var fragElem = document.getElementById( fragmentShaderId );
    if ( !fragElem ) {
        alert( "Unable to load vertex shader " + fragmentShaderId );
        return -1;
    }
    else {
        fragShdr = gl.createShader( gl.FRAGMENT_SHADER );
        gl.shaderSource( fragShdr, fragElem.textContent.replace(/^\s+|\s+$/g, '' ) );
        gl.compileShader( fragShdr );
        if ( !gl.getShaderParameter(fragShdr, gl.COMPILE_STATUS) ) {
            var msg = "Fragment shader failed to compile.  The error log is:"
        	+ "<pre>" + gl.getShaderInfoLog( fragShdr ) + "</pre>";
            alert( msg );
            return -1;
        }
    }

    var program = gl.createProgram();
    gl.attachShader( program, vertShdr );
    gl.attachShader( program, fragShdr );
    gl.linkProgram( program );

    if ( !gl.getProgramParameter(program, gl.LINK_STATUS) ) {
        var msg = "Shader program failed to link.  The error log is:"
            + "<pre>" + gl.getProgramInfoLog( program ) + "</pre>";
        alert( msg );
        return -1;
    }

    return program;
}


// EXECUTION: Code executes starting here when we launch this file
window.onload = function init()
{
    canvas = document.getElementById( "gl-canvas" );

    //
    //   Grab the section of the screen for drawing.
    //   All graphic output is within the canvas
    //
    gl = canvas.getContext('webgl2');
    if (!gl) { alert( "WebGL 2.0 isn't available" ); }

    //
    //  Load shaders and initialize attribute buffers
    //
    program = initShaders( gl, "vertex-shader", "fragment-shader" );
    gl.useProgram( program );


    ////////////////////////////////////////////////////////////////////////////////
    // Define a unit square as a TRIANGLE_FAN
    // Four corners: bottom-left, bottom-right, top-right, top-left
    // The TRIANGLE_FAN primitive connects them into two triangles forming a quad
    //
    var squareVerts = new Float32Array([
    //    X      Y
        -1.0,  -1.0,   // bottom-left
         1.0,  -1.0,   // bottom-right
         1.0,   1.0,   // top-right
        -1.0,   1.0    // top-left
    ]);


    ////////////////////////////////////////////////////////////////////////////////
    // Load the data into the GPU Buffer
    //
    var squareBuffer = gl.createBuffer();
    gl.bindBuffer( gl.ARRAY_BUFFER, squareBuffer );
    gl.bufferData( gl.ARRAY_BUFFER, squareVerts, gl.STATIC_DRAW );

    // Associate shader attribute variable with our data buffer
    var aPosition = gl.getAttribLocation( program, "aPosition" );
    gl.vertexAttribPointer( aPosition, 2, gl.FLOAT, false, 0, 0 );
    gl.enableVertexAttribArray( aPosition );


    ////////////////////////////////////////////////////////////////////////////////
    // Get uniform locations
    //
    var uColor_loc  = gl.getUniformLocation( program, "uColor" );
    var uOffset_loc = gl.getUniformLocation( program, "uOffset" );
    var uScale_loc  = gl.getUniformLocation( program, "uScale" );


    ////////////////////////////////////////////////////////////////////////////////
    // Configure WebGL settings
    //
    gl.viewport( 0, 0, canvas.width, canvas.height );

    // Background color: warm off-white (like an old canvas)
    gl.clearColor( 0.95, 0.93, 0.90, 1.0 );
    gl.clear( gl.COLOR_BUFFER_BIT );


    ////////////////////////////////////////////////////////////////////////////////
    // Define the 4 nested squares (drawn back-to-front, largest first)
    //
    // Each square is defined by:
    //   color:   [R, G, B, A]   — solid color for this square
    //   scaleX:  half-width in NDC
    //   scaleY:  half-height in NDC
    //   offsetY: vertical center offset (negative = shifted down)
    //
    // In Albers' paintings:
    //   - Squares are centered horizontally (offsetX = 0 for all)
    //   - Squares sit lower: more space above than below
    //   - The bottom edges are closer together than the top edges
    //   - Each square is slightly shorter than it is wide
    //
    // Color palette inspired by Albers' warm earth-tone compositions
    //

    var squares = [
        // Square 0 (outermost): deep muted olive green
        {
            color:   [0.30, 0.35, 0.25, 1.0],
            scaleX:  0.92,
            scaleY:  0.92,
            offsetX: 0.0,
            offsetY: -0.02
        },
        // Square 1: warm golden ochre
        {
            color:   [0.76, 0.60, 0.22, 1.0],
            scaleX:  0.72,
            scaleY:  0.70,
            offsetX: 0.0,
            offsetY: -0.12
        },
        // Square 2: rich burnt orange
        {
            color:   [0.82, 0.48, 0.20, 1.0],
            scaleX:  0.54,
            scaleY:  0.50,
            offsetX: 0.0,
            offsetY: -0.20
        },
        // Square 3 (innermost): luminous warm yellow
        {
            color:   [0.93, 0.80, 0.30, 1.0],
            scaleX:  0.38,
            scaleY:  0.33,
            offsetX: 0.0,
            offsetY: -0.26
        }
    ];


    ////////////////////////////////////////////////////////////////////////////////
    // Draw each square using the same buffer and shader pair
    // Just update the uniform variables before each drawArrays call
    //
    for (var i = 0; i < squares.length; i++)
    {
        var sq = squares[i];

        // Set the color uniform for the fragment shader
        gl.uniform4fv( uColor_loc, sq.color );

        // Set the offset uniform to position this square
        gl.uniform2f( uOffset_loc, sq.offsetX, sq.offsetY );

        // Set the scale uniform to size this square
        gl.uniform2f( uScale_loc, sq.scaleX, sq.scaleY );

        // Draw the square as a TRIANGLE_FAN (4 vertices = 2 triangles = 1 quad)
        gl.drawArrays( gl.TRIANGLE_FAN, 0, 4 );
    }

};

</script>

</html>
